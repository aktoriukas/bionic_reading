<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Bionic Reading</h1>
      <button id="bionic_reading_btn">Turn on</button>
      <label>
        <span>Keep enabled on new pages</span>
        <input id="persist_across_pages" type="checkbox" />
      </label>
      <p>Shortcut <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>B</kbd></p>
    </main>
    <script src="index.js"></script>
  </body>
</html>
